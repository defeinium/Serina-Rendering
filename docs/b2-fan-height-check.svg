<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" font-family="Arial, sans-serif"><rect width="1000" height="530" fill="#fff"/><text x="30" y="35" font-size="23" fill="#24363c" text-anchor="start" font-weight="700">HEIGHT CHECK · why the top doors matter</text><rect x="50" y="73.75" width="220" height="356.25" fill="#e2dace" stroke="#657a7c"/><path d="M50,147.5 L270,147.5" fill="none" stroke="#975c2d" stroke-width="2"/><path d="M20,73.75 L780,73.75" fill="none" stroke="#24363c" stroke-width="2"/><path d="M275,109.125 L485,109.125" fill="none" stroke="#a94c41" stroke-width="4"/><text x="515" y="114.125" font-size="17" fill="#a94c41" text-anchor="start" font-weight="400">Blade plane ≈2567 mm: model illustration only</text><text x="285" y="169.5" font-size="17" fill="#24363c" text-anchor="start" font-weight="400">Main-door top ≈2260 mm</text><text x="285" y="65.75" font-size="17" fill="#24363c" text-anchor="start" font-weight="400">Ceiling / cabinet top ≈2850 mm: unmeasured</text><text x="155" y="113.75" font-size="17" fill="#24363c" text-anchor="middle" font-weight="400">Loft door</text><text x="155" y="292.5" font-size="17" fill="#24363c" text-anchor="middle" font-weight="400">Main door</text><text x="30" y="474" font-size="20" fill="#24363c" text-anchor="start" font-weight="700">The rotating fan and opening loft doors share a height band.</text><text x="30" y="505" font-size="17" fill="#24363c" text-anchor="start" font-weight="400">The main doors may pass BELOW the blades; do not infer a collision from top view alone.</text></svg>